name: CI

# 门禁：每次 push / PR 都必须过「lint → typecheck → test → build → guard → budget」。
# 顺序不可调换：build 会触发 prebuild（生成索引与分片），guard / budget 依赖这些产物。
#
# 铁律（方案 §12.3 C 类）：
#   - 本 workflow **禁止** `|| true`、`continue-on-error`、`if: always()` 掩盖失败；
#   - guard（已裁决废弃项断言）与 budget（体积预算）任一失败即 CI 红灯。

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build / guard / budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build (含 prebuild 索引/分片生成)
        run: npm run build

      - name: Guard (已裁决废弃项断言)
        run: npm run guard

      - name: Budget (bundle / 分片体积预算)
        run: npm run budget
